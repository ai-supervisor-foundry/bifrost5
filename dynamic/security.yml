http:
  routers:
    edgekit-probe-block:
      priority: 1000
      entryPoints:
        - web
      rule: "PathPrefix(`/.env`) || PathPrefix(`/.git`) || PathPrefix(`/vendor/phpunit`) || PathPrefix(`/cgi-bin`) || PathPrefix(`/wp-admin`) || PathPrefix(`/wp-login.php`) || PathPrefix(`/phpunit`) || PathPrefix(`/actuator`) || PathPrefix(`/server-status`)"
      middlewares:
        - edgekit-security
      service: edgekit-blackhole

  middlewares:
    # Traefik v3 rejects a middleware that declares two types (headers + rateLimit),
    # so the security chain is split into single-type middlewares and chained.
    edgekit-security:
      chain:
        middlewares:
          - edgekit-security-headers
          - edgekit-security-ratelimit

    edgekit-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        customFrameOptionsValue: SAMEORIGIN
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: no-referrer-when-downgrade
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
          server: ""

    edgekit-security-ratelimit:
      rateLimit:
        average: 20
        period: 1s
        burst: 60
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    edgekit-access-jwt:
      forwardAuth:
        address: http://access-verifier:9000/verify
        authRequestHeaders:
          - Cf-Access-Jwt-Assertion
        trustForwardHeader: false

  services:
    edgekit-blackhole:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:9
