name: edgekit

services:
  traefik:
    image: traefik:v3.7.13
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.middlewares=edgekit-security@file"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingSize=100"
    ports:
      - "127.0.0.1:${EDGEKIT_HTTP_PORT:-18080}:80"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./logs/traefik:/var/log/traefik
    networks:
      - edgekit-net
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - edgekit-net
    restart: unless-stopped
    profiles:
      - tunnel

  access-verifier:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "src/verifier/server.ts"]
    environment:
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
    networks:
      - edgekit-net
    restart: unless-stopped

  edgekit-notfound:
    image: nginx:alpine
    volumes:
      - ./notfound/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edgekit-net
    restart: unless-stopped

networks:
  edgekit-net:
    name: edgekit-net
